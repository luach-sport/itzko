name: Website

# The main Itzko site (GitHub Pages): every app in one place. Rebuilt on every change here and once a day.
# The kit/ folder is also used by each app's own site (their workflows check out this repo).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the browser (for the preview picture and the checks)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Build the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # download counts from the releases
        run: |
          ln -s "$RUNNER_TEMP/pw/node_modules" node_modules
          node kit/lib/build.mjs

      - name: Publish to the gh-pages branch (GitHub Pages serves it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_RUN_ID}" > _site/build.txt
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "האתר הראשי של Itzko: עדכון אוטומטי (${GITHUB_SHA::7})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Check the live site
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            sleep 10
            LIVE=$(curl -sf "https://luach-sport.github.io/itzko/build.txt?t=$(date +%s)" || true)
            [ "$LIVE" = "${GITHUB_RUN_ID}" ] && break
          done
          B=https://luach-sport.github.io
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          echo "::notice title=live::updated=$([ "$LIVE" = "${GITHUB_RUN_ID}" ] && echo yes || echo no) hub=$(code $B/itzko/) apps=$(code $B/itzko/apps.json) shamarti=$(code $B/shamarti/) mycar=$(code $B/mycar/) chovotai=$(code $B/chovotai/) tfilati=$(code $B/tfilati/)"
